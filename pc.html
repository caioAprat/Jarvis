<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Jarvis · Central</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f17">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* mesmos tokens do app do celular e do Meu dinheiro */
  :root {
    --bg: #080706; --card: #120e0b; --card2: #1b1510; --linha: rgba(255,170,100,.1);
    --tx: #f6eadb; --mu: #b09c86; --di: #9a8670;
    --ok: #7bf0b4; --ok2: rgba(123,240,180,.13); --er: #ff4d5e; --er2: rgba(255,77,94,.14);
    --av: #ffc247; --av2: rgba(255,194,71,.13); --pri: #ff9a4d; --pri2: rgba(255,138,61,.16);
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace; --disp: "Chakra Petch", "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: radial-gradient(ellipse 80% 60% at 60% 0%, rgba(255,120,40,.09), transparent 70%), radial-gradient(ellipse 50% 40% at 0% 100%, rgba(255,90,30,.06), transparent 70%); pointer-events: none; }
  h1, .marca, .numero { font-family: var(--disp); }
  .titulo, .pill, .cont, .sub { font-family: var(--mono); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body { color: var(--tx); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  button[disabled] { opacity: .55; cursor: default; }
  a { color: var(--pri); }
  :focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; border-radius: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  h1 { text-wrap: balance; } p { text-wrap: pretty; }

  .layout { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  nav { position: sticky; top: 0; height: 100vh; padding: 22px 14px; border-right: 1px solid var(--linha); display: flex; flex-direction: column; gap: 4px; background: #0d121c; }
  .marca { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 780; padding: 0 10px 18px; }
  .orbe { width: 12px; height: 12px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 12px var(--ok); flex: none; }
  .orbe.atencao { background: var(--av); box-shadow: 0 0 12px var(--av); } .orbe.erro { background: var(--er); box-shadow: 0 0 12px var(--er); }
  nav button { display: flex; justify-content: space-between; align-items: center; text-align: left; padding: 9px 12px; border-radius: 10px; color: var(--mu); font-weight: 600; }
  nav button:hover { background: var(--card); color: var(--tx); }
  nav button[aria-current="page"] { background: var(--pri2); color: var(--tx); }
  nav .rodape { margin-top: auto; color: var(--di); font-size: 12px; padding: 0 10px; }
  .cont { display: inline-block; min-width: 20px; padding: 0 7px; border-radius: 999px; background: var(--card2); color: var(--mu); font-size: 11.5px; text-align: center; }
  .cont.alerta { background: var(--er); color: #0b0f17; }

  main { padding: 26px 32px 60px; max-width: 1240px; width: 100%; min-width: 0; }
  header.topo { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 20px; }
  h1 { font-size: 24px; font-weight: 760; letter-spacing: -.3px; outline: none; }
  .sub { color: var(--mu); font-size: 13px; }
  .grade { display: grid; gap: 14px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--linha); border-radius: 16px; padding: 18px; min-width: 0; }
  .card.dentro { background: var(--card2); border-radius: 12px; padding: 14px; }
  .card.atencao { border-color: rgba(251,191,36,.35); } .card.erro { border-color: rgba(251,113,133,.4); }
  .titulo { color: var(--mu); font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 12px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .titulo small { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--di); }
  .btn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 7px 14px; border-radius: 10px; background: var(--pri2); color: var(--pri); font-weight: 650; font-size: 13px; transition: transform .12s cubic-bezier(.2,0,0,1), filter .12s; }
  .btn:active:not([disabled]) { transform: scale(.96); }
  .btn.forte { background: var(--pri); color: #0b0f17; }
  .btn.sec { background: var(--card2); color: var(--tx); font-weight: 600; }
  .btn.perigo { background: var(--er2); color: var(--er); }
  .btn.mini { min-height: 28px; padding: 3px 10px; font-size: 12.5px; }
  .btn:hover:not([disabled]) { filter: brightness(1.12); }
  .pill { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .pill.ok { background: var(--ok2); color: var(--ok); }
  .pill.atencao, .pill.andamento { background: var(--av2); color: var(--av); }
  .pill.erro, .pill.alta { background: var(--er2); color: var(--er); }
  .pill.pausado, .pill.config, .pill.aguardando, .pill.novo, .pill.cancelado, .pill.normal, .pill.baixa { background: var(--card2); color: var(--mu); }
  .pill.feito { background: var(--ok2); color: var(--ok); }
  .projcard { display: flex; flex-direction: column; gap: 8px; }
  .projcard .cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .projcard b { font-size: 15px; }
  .det { color: var(--mu); font-size: 13px; overflow-wrap: anywhere; }
  .peq { color: var(--di); font-size: 12px; }
  .barras { display: flex; align-items: stretch; gap: 2px; height: 26px; }
  .barras i { flex: 1; border-radius: 2px; background: var(--ok); opacity: .8; }
  .barras i.medio { background: var(--av); } .barras i.ruim { background: var(--er); } .barras i.vazio { background: var(--card2); opacity: 1; }
  .numero { font-size: 26px; font-weight: 780; letter-spacing: -.5px; }
  .rolar { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--di); font-weight: 600; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--linha); }
  td { padding: 8px; border-bottom: 1px solid var(--linha); vertical-align: top; }
  td.num, th.num { text-align: right; }
  tbody tr:last-child td { border-bottom: 0; }
  .vazio { color: var(--di); font-size: 13px; }
  label.campo { display: block; font-size: 12px; color: var(--mu); margin-bottom: 4px; }
  input.inp, select.inp, textarea.inp { width: 100%; background: var(--card2); border: 1px solid var(--linha); border-radius: 10px; padding: 9px 11px; }
  textarea.inp { min-height: 110px; resize: vertical; }
  .linha-form { display: grid; grid-template-columns: 1fr 160px; gap: 10px; margin-bottom: 10px; }
  .cfg { display: grid; grid-template-columns: 1fr 200px auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--linha); }
  .cfg:last-child { border-bottom: 0; }
  .aviso { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linha); }
  .aviso:last-child { border-bottom: 0; }
  .aviso i { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--pri); }
  .aviso i.urgente { background: var(--er); } .aviso i.atencao { background: var(--av); } .aviso i.ok { background: var(--ok); }
  .aviso p { color: var(--mu); font-size: 13px; white-space: pre-line; }
  .aviso.novo b::after { content: "novo"; margin-left: 8px; font-size: 10.5px; font-weight: 700; color: var(--pri); background: var(--pri2); padding: 1px 7px; border-radius: 999px; }
  .pedido { padding: 12px 0; border-bottom: 1px solid var(--linha); }
  .pedido:last-child { border-bottom: 0; }
  .pedido .cab { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pedido p { color: var(--mu); white-space: pre-line; margin-top: 4px; }
  .resposta { margin-top: 8px; padding: 10px 12px; background: var(--ok2); border-radius: 10px; color: var(--tx); white-space: pre-line; font-size: 13px; }
  .lista-tarefas li { list-style: none; display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--linha); }
  .lista-tarefas li:last-child { border-bottom: 0; }
  .ponto { width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(-1px); }
  .ponto.erro { background: var(--er); } .ponto.atencao { background: var(--av); } .ponto.info { background: var(--pri); }
  .atalhos { display: flex; gap: 8px; flex-wrap: wrap; }
  .voltar-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  pre.saida { background: #0d121c; border: 1px solid var(--linha); border-radius: 10px; padding: 12px; white-space: pre-wrap; font: 12.5px/1.5 ui-monospace, Consolas, monospace; max-height: 360px; overflow: auto; }
  .faixa { border-radius: 12px; padding: 11px 14px; margin-bottom: 14px; background: var(--av2); color: var(--av); }
  .faixa.erro { background: var(--er2); color: var(--er); }
  #toast { position: fixed; right: 24px; bottom: 24px; z-index: 20; max-width: 420px; }
  #toast div { background: #16261f; color: var(--ok); border-radius: 12px; padding: 12px 16px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  #toast div.ruim { background: #2a2414; color: var(--av); }
  .skel { height: 120px; border-radius: 16px; background: linear-gradient(90deg, var(--card), var(--card2), var(--card)); background-size: 200% 100%; animation: b 1.4s infinite; margin-bottom: 14px; }
  @keyframes b { to { background-position: -200% 0; } }
  .hud { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
  .hud > div { padding: 10px 14px; border-radius: 10px; background: rgba(18,14,11,.8); box-shadow: 0 0 0 1px rgba(255,160,80,.16); }
  .hud small { display: block; font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--di); }
  .hud b { display: block; margin-top: 2px; font: 700 21px var(--disp); letter-spacing: .01em; }
  .palco { position: relative; height: clamp(440px, 64vh, 720px); margin-bottom: 14px; border-radius: 18px; overflow: hidden; background: radial-gradient(ellipse at 50% 50%, #1a0f08 0%, #0a0806 62%, #070605 100%);
    box-shadow: 0 0 0 1px rgba(255,160,80,.2), 0 24px 60px rgba(0,0,0,.55); }
  .palco::before, .palco::after { content: ""; position: absolute; z-index: 2; width: 18px; height: 18px; pointer-events: none; border: 1.5px solid rgba(255,160,80,.55); }
  .palco::before { left: 12px; top: 12px; border-right: 0; border-bottom: 0; } .palco::after { right: 12px; bottom: 12px; border-left: 0; border-top: 0; }
  .palco .semmapa { position: absolute; inset: 0; display: grid; place-items: center; color: var(--di); font: 500 13px var(--mono); padding: 24px; text-align: center; }
  .painel-sel { position: absolute; z-index: 3; top: 14px; right: 14px; max-height: calc(100% - 28px); width: min(360px, calc(100% - 28px)); overflow: auto; border-radius: 12px; background: rgba(12,9,7,.9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 0 0 1px rgba(255,160,80,.4), 0 16px 40px rgba(0,0,0,.6); padding: 4px; animation: entra .28s cubic-bezier(.2,0,0,1); }
  .painel-sel .card { background: transparent; border: 0; } .painel-sel .projcard .cab { padding-right: 38px; }
  .painel-sel .fechar { position: absolute; right: 8px; top: 8px; z-index: 1; }
  @keyframes entra { from { opacity: 0; transform: translateX(14px); } }
  .acesso { max-width: 520px; margin: 12vh auto; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    nav { position: static; height: auto; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; padding: 10px 12px; gap: 6px; scrollbar-width: none; }
    nav .marca { padding: 0 8px 0 0; } nav .rodape { display: none; } nav button { flex: none; }
    .g2, .g3 { grid-template-columns: 1fr; } main { padding: 18px; }
    .hud { grid-template-columns: repeat(2, minmax(0, 1fr)); } .palco { height: 56vh; } .painel-sel { top: auto; max-height: 62%; width: auto; left: 10px; right: 10px; bottom: 10px; }
    .cfg { grid-template-columns: 1fr auto; } .cfg .inp { grid-column: 1 / -1; order: 2; }
    header.topo { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } .btn { transition: none; } }
</style>
</head>
<body>
<div id="raiz"><div class="acesso"><div class="skel"></div></div></div>
<div id="toast" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="mapa-vivo.js?v=8"></script>
<script>
'use strict';
// ---------------------------------------------------------------- utilidades
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => Number(n) || 0;
const linkSeguro = u => /^https:\/\//.test(String(u || '')) ? esc(u) : '';
const anoAtual = new Date().getFullYear();
const dataHora = iso => { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleString('pt-BR', Object.assign({ day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }, d.getFullYear() !== anoAtual ? { year: '2-digit' } : {})); };
const dm = d => d ? d.slice(8, 10) + '/' + d.slice(5, 7) : '';
const pct = n => n === null || n === undefined ? '—' : String(n).replace('.', ',') + '%';
const plural = (n, um, varios) => n + ' ' + (n === 1 ? um : varios);
const hojeIso = (mais = 0) => { const d = new Date(Date.now() + mais * 864e5); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
function ha(iso) {
  if (!iso) return '';
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  return m < 1 ? 'agora' : m < 60 ? `há ${m} min` : m < 1440 ? `há ${Math.round(m / 60)}h` : 'em ' + dataHora(iso);
}
function duracao(min) { return min < 60 ? Math.round(min) + ' min' : (Math.round(min / 6) / 10).toString().replace('.', ',') + 'h'; }
const NOMES = { ok: 'ok', atencao: 'atenção', erro: 'problema', pausado: 'pausado', config: 'configurar', aguardando: 'aguardando',
                novo: 'novo', andamento: 'em andamento', feito: 'feito', cancelado: 'cancelado', alta: 'alta', normal: 'normal', baixa: 'baixa' };
const ESTADO_FRASE = { ok: 'funcionando', atencao: 'com atenção', erro: 'com problema', pausado: 'pausado', config: 'a configurar', aguardando: 'aguardando' };
const ORDEM = { erro: 0, atencao: 1, config: 2, aguardando: 3, ok: 4, pausado: 5 };
const porGravidade = (a, b) => (ORDEM[a.status] ?? 9) - (ORDEM[b.status] ?? 9);
const PUB = { success: ['ok', 'publicado'], failure: ['erro', 'falhou'], cancelled: ['cancelado', 'cancelado'], skipped: ['cancelado', 'pulado'],
  timed_out: ['erro', 'demorou demais'], action_required: ['atencao', 'precisa de ação'], in_progress: ['andamento', 'publicando'], queued: ['andamento', 'na fila'],
  READY: ['ok', 'no ar'], ERROR: ['erro', 'falhou'], BUILDING: ['andamento', 'montando'], QUEUED: ['andamento', 'na fila'], CANCELED: ['cancelado', 'cancelado'], INITIALIZING: ['andamento', 'começando'] };
const pillPub = s => { const [c, t] = PUB[s] || ['config', s || '—']; return `<span class="pill ${c}">${esc(t)}</span>`; };
const pill = s => `<span class="pill ${esc(s)}">${esc(NOMES[s] || s)}</span>`;
let toastT = null;
function avisar(texto, ruim) {
  const el = $('toast'); el.setAttribute('role', ruim ? 'alert' : 'status');
  el.innerHTML = texto ? `<div class="${ruim ? 'ruim' : ''}">${esc(texto)}</div>` : '';
  clearTimeout(toastT); if (texto) toastT = setTimeout(() => avisar(''), ruim ? 8000 : 4500);
}

// ---------------------------------------------------------------- acesso (separado do celular: chave do PC)
const LS = 'jarvis.pc.cfg', LR = 'jarvis.pc.rasc';
function cfgDeTexto(texto) {
  const i = String(texto || '').indexOf('#');
  const h = new URLSearchParams(String(texto).slice(i + 1).replace(/&amp;/g, '&'));
  return i >= 0 && h.get('k') && h.get('u') ? { k: h.get('k'), u: h.get('u') } : null;
}
let CFG = cfgDeTexto(location.href);
if (CFG) { try { localStorage.setItem(LS, JSON.stringify(CFG)); } catch (e) {} history.replaceState(null, '', location.pathname); }
else { try { CFG = JSON.parse(localStorage.getItem(LS)); } catch (e) { CFG = null; } }

async function api(acao, extra) {
  const q = new URLSearchParams(Object.assign({ k: CFG.k, acao }, extra || {}));
  const r = await fetch(CFG.u + '?' + q, { cache: 'no-store', redirect: 'follow' });
  return JSON.parse(await r.text());
}
async function post(corpo) {
  const r = await fetch(CFG.u + '?k=' + encodeURIComponent(CFG.k), { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(corpo) });
  return JSON.parse(await r.text());
}

// ---------------------------------------------------------------- estado
const ABAS = [
  ['geral', 'Visão geral'], ['clientes', 'Clientes'], ['pedidos', 'Pedidos'], ['versoes', 'Publicações e versões'],
  ['assistente', 'Assistente'], ['mapa', 'Mapa dos projetos'], ['avisos', 'Avisos e registro'], ['ajustes', 'Ajustes'],
];
const abaValida = a => ABAS.some(x => x[0] === a) ? a : 'geral';
const S = { P: null, quando: 0, aba: abaValida(location.hash.slice(1)), carregando: false, erro: '', versoes: {}, pub: null, cfgAssist: null, logAssist: null,
            sel: '', sit: ['ok', ''], saidaRotina: '', filtro: 'abertos', voltar: null, cancelar: null, apagarToken: null, ocupado: '', busca: '', rasc: {} };
try { S.rasc = JSON.parse(localStorage.getItem(LR)) || {}; } catch (e) { S.rasc = {}; }
// mapa vivo (Three.js + GSAP); sem WebGL ou sem as bibliotecas, a tela segue funcionando só com os cartões
const MV = (() => { try { return window.MapaVivo && MapaVivo.montar({ aoSelecionar: id => { S.sel = S.sel === id ? '' : id; render(); } }); } catch (e) { return null; } })();
const guardarRasc = () => { try { localStorage.setItem(LR, JSON.stringify({ pedTit: S.rasc.pedTit, pedTxt: S.rasc.pedTxt, pedProj: S.rasc.pedProj, pedPrio: S.rasc.pedPrio })); } catch (e) {} };

async function carregar(conferir) {
  if (!CFG || S.carregando) return;
  S.carregando = true; render();
  try {
    if (conferir) await post({ tipo: 'verificar' });
    const P = await api('pc');
    if (P.ok === false) { S.erro = /chave/i.test(P.erro || '') ? 'auth' : (P.erro || 'erro'); }
    else { S.P = P; S.erro = ''; S.quando = Date.now(); }
  } catch (e) { S.erro = 'rede'; }
  S.carregando = false; render();
  if (MV && !S.erro) MV.varredura();
  if (S.aba === 'versoes') carregarVersoes(!!conferir);
  if (S.aba === 'assistente' && (!S.cfgAssist || conferir)) carregarAssistente();
}
async function carregarVersoes(forcar) {
  if (forcar) { S.versoes = {}; S.pub = null; render(); }
  const tarefas = ['assistente', 'jarvis'].filter(a => !S.versoes[a]).map(a => api('versoes', { app: a }).then(r => { S.versoes[a] = r; }).catch(() => { S.versoes[a] = { ok: false, erro: 'sem conexão' }; }));
  if (!S.pub) tarefas.push(api('publicacoes').then(r => { S.pub = r; }).catch(() => { S.pub = { ok: false, erro: 'sem conexão' }; }));
  await Promise.all(tarefas); render();
}
async function carregarAssistente() {
  try { const [c, l] = await Promise.all([api('assistente-config'), api('assistente-log')]); S.cfgAssist = c; S.logAssist = l; }
  catch (e) { S.cfgAssist = S.logAssist = { ok: false, erro: 'sem conexão' }; }
  render();
}
/** Roda uma ação deixando os botões desabilitados (evita clique duplo mesmo se a tela for redesenhada). */
async function ocupado(chave, fn) {
  if (S.ocupado) return;
  S.ocupado = chave; render();
  try { return await fn(); } finally { S.ocupado = ''; render(); }
}
async function enviar(corpo, okTexto) {
  try { const r = await post(corpo); avisar(r.ok ? (okTexto || r.aviso || 'Feito') : 'Não consegui: ' + (r.erro || r.aviso || 'erro'), !r.ok); return r; }
  catch (e) { avisar('Sem conexão com o Jarvis.', true); return { ok: false }; }
}
const dis = () => S.ocupado ? 'disabled' : '';

// ---------------------------------------------------------------- dados derivados
function jarvisParado(P) { return P.estado.verificadoEm && Date.now() - new Date(P.estado.verificadoEm).getTime() > 30 * 60e3; }
/** O que precisa da atenção do Caio agora, do mais grave para o menos. */
function tarefas(P) {
  const L = [];
  if (jarvisParado(P)) L.push(['erro', `O Jarvis não confere nada desde ${dataHora(P.estado.verificadoEm)}`, 'Abra o editor do Apps Script do Jarvis → Acionadores, ou rode "instalar".']);
  P.estado.projetos.slice().sort(porGravidade).filter(p => p.status === 'erro' || p.status === 'atencao').forEach(p =>
    L.push([p.status === 'erro' ? 'erro' : 'atencao', `${p.icone} ${p.nome}: ${NOMES[p.status]}`, p.detalhe]));
  P.estado.projetos.filter(p => p.status === 'config').forEach(p => L.push(['info', `${p.icone} ${p.nome}: falta configurar`, p.detalhe]));
  if (!P.estado.inscricoes) L.push(['atencao', 'Nenhum aparelho recebendo notificações', 'Abra o Jarvis no iPhone e toque em "Ativar notificações".']);
  const tam = ((P.detalhes.planilha || {}).planilha || {}).tamanho;
  if (tam && tam.pct >= 80) L.push([tam.pct >= 90 ? 'erro' : 'atencao', `Planilha J Hissnauer com ${pct(tam.pct)} do limite de células`, 'Maiores abas: ' + (tam.maiores || []).map(x => x.nome).join(', ')]);
  P.pedidos.filter(x => x.status === 'novo' && x.prioridade === 'alta').forEach(x => L.push(['info', `Pedido #${x.id} (alta): ${x.titulo}`, 'Na fila, esperando a próxima sessão do Claude Code.']));
  if (!P.configs.backupPlanilha) L.push(['atencao', 'Cópia diária da planilha desligada', 'Ligue em Ajustes.']);
  if (!P.configs.operador) L.push(['info', 'Configurações do assistente desligadas', 'Falta ligar a chave de operador do assistente.']);
  return L;
}
/** Quedas (de qualquer estado para "problema") com a duração, a partir do histórico. */
function quedas(hist) {
  const h = (hist || []).slice().reverse(), lista = [];
  h.forEach((x, i) => { if (x.para === 'erro') { const volta = h.slice(i + 1).find(y => y.de === 'erro'); lista.push({ ini: x.quando, fim: volta ? volta.quando : null, motivo: x.detalhe }); } });
  return lista.reverse();
}

// ---------------------------------------------------------------- pedaços de tela
function barras30(disp) {
  const dias = []; for (let i = 29; i >= 0; i--) dias.push(hojeIso(-i));
  const porDia = {}; (disp || []).forEach(x => { porDia[x.d] = x; });
  const ruins = dias.filter(d => porDia[d] && porDia[d].t && porDia[d].u < porDia[d].t);
  const t = dias.reduce((s, d) => s + (porDia[d] ? porDia[d].t : 0), 0), u = dias.reduce((s, d) => s + (porDia[d] ? porDia[d].u : 0), 0);
  const resumo = t ? `30 dias: ${pct(Math.round(u / t * 1000) / 10)} no ar` + (ruins.length ? `; ${plural(ruins.length, 'dia', 'dias')} com queda (${ruins.slice(-5).map(dm).join(', ')})` : '; nenhum dia com queda') : 'Sem dados ainda';
  return `<div class="barras" role="img" aria-label="${esc(resumo)}">${dias.map(d => {
    const x = porDia[d]; if (!x || !x.t) return `<i class="vazio" title="${dm(d)}: sem dados"></i>`;
    const p = x.u / x.t * 100;
    return `<i class="${p >= 99.5 ? '' : p >= 97 ? 'medio' : 'ruim'}" title="${dm(d)}: ${pct(Math.round(p * 10) / 10)} no ar"></i>`;
  }).join('')}</div><div class="peq" style="margin-top:4px">${esc(resumo)}</div>`;
}

// ---------------------------------------------------------------- montagem
function render() {
  const raiz = $('raiz');
  if (!CFG || S.erro === 'auth') {
    raiz.innerHTML = `<div class="acesso card"><div class="titulo">${S.erro === 'auth' ? 'Acesso recusado' : 'Jarvis · Central do PC'}</div>
      <p class="det" style="margin-bottom:12px">Cole o <b>link da central do PC</b> que veio no Telegram (só desta vez neste computador).</p>
      <form onsubmit="return false"><label class="sr" for="cola">Link da central do PC</label><input class="inp" id="cola" type="url" autocomplete="off" spellcheck="false" placeholder="https://caioaprat.github.io/Jarvis/pc.html#k=...">
      <button type="submit" class="btn forte" style="margin-top:12px" data-acao="colar">Entrar</button></form></div>`;
    return;
  }
  if (!S.P) { raiz.innerHTML = S.erro ? `<div class="acesso card"><p>Não consegui falar com o Jarvis (${esc(S.erro)}).</p><button type="button" class="btn" style="margin-top:12px" data-acao="tentar">Tentar de novo</button></div>` : '<div class="acesso"><div class="skel"></div><div class="skel"></div></div>'; return; }
  const P = S.P, ps = P.estado.projetos;
  const geral = jarvisParado(P) || ps.some(p => p.status === 'erro') ? 'erro' : ps.some(p => p.status === 'atencao') || !P.estado.inscricoes ? 'atencao' : 'ok';
  const contagem = { pedidos: [P.pedidos.filter(x => x.status === 'novo' || x.status === 'andamento').length, 'pendentes'],
    avisos: [P.estado.avisos.filter(a => a.id > (P.estado.avisosVistosAte || 0)).length, 'novos'],
    clientes: [ps.filter(p => p.cliente && (p.status === 'erro' || p.status === 'atencao')).length, 'com problema'] };
  const telas = { geral: telaGeral, clientes: telaClientes, pedidos: telaPedidos, versoes: telaVersoes, assistente: telaAssistente, mapa: telaMapa, avisos: telaAvisos, ajustes: telaAjustes };
  let conteudo;
  try { conteudo = (telas[S.aba] || telaGeral)(); }
  catch (e) { conteudo = `<div class="faixa erro">Esta seção falhou ao montar (${esc(e.message)}). <button type="button" class="btn sec mini" data-acao="tentar">Recarregar</button></div>`; }
  const desde = S.quando ? ha(new Date(S.quando).toISOString()) : '';
  const sub = S.carregando ? 'atualizando…' : S.erro ? `<span style="color:var(--av)">Sem conexão com o Jarvis · dados de ${esc(desde)}</span>` : 'atualizado ' + esc(desde);
  // guarda foco e cursor para não atrapalhar quem está digitando
  const ativo = document.activeElement, focoId = ativo && ativo.id;
  let selA = null, selB = null; try { selA = ativo.selectionStart; selB = ativo.selectionEnd; } catch (e) { /* sem cursor */ }
  const titulo = (ABAS.find(a => a[0] === S.aba) || ABAS[0])[1];
  raiz.innerHTML = `<div class="layout"><nav aria-label="Seções"><div class="marca"><span class="orbe ${geral}" aria-hidden="true"></span>Jarvis</div>
      ${ABAS.map(([id, nome]) => { const [n, rot] = contagem[id] || [0, '']; return `<button type="button" id="nav-${id}" ${S.aba === id ? 'aria-current="page"' : ''} data-aba="${id}">${nome}${n ? `<span class="cont ${id === 'clientes' ? 'alerta' : ''}">${n}<span class="sr"> ${rot}</span></span>` : ''}</button>`; }).join('')}
      <div class="rodape">Servidor v${num(P.versao)} · conferido ${ha(P.estado.verificadoEm)}</div></nav>
    <main><header class="topo"><div><h1 tabindex="-1">${esc(titulo)}</h1><div class="sub">${sub}</div></div>
      <button type="button" class="btn" data-acao="conferir" ${S.carregando || S.ocupado ? 'disabled' : ''}>${S.carregando ? 'Conferindo…' : '↻ Conferir tudo agora'}</button></header>
      ${conteudo}</main></div>`;
  raiz.querySelectorAll('input[id],textarea[id],select[id]').forEach(el => { if (el.type !== 'password' && el.id in S.rasc) el.value = S.rasc[el.id]; });
  ligarMapa();
  if (focoId && $(focoId)) { const n = $(focoId); n.focus({ preventScroll: true }); try { if (selA !== null) n.setSelectionRange(selA, selB); } catch (e) { /* tipo sem cursor */ } }
}

/** O mapa vivo é um elemento só, criado uma vez: a tela é redesenhada o tempo todo, então ele é só reposto no lugar. */
function ligarMapa() {
  if (!MV) return;
  const slot = $('mapa-slot');
  if (!slot || !S.P) { MV.pausar(true); return; }
  if (MV.el.parentNode !== slot) slot.appendChild(MV.el);
  MV.pausar(false);
  MV.atualizar(S.P.estado.projetos, { estado: S.sit[0], titulo: S.sit[1] });
  MV.selecionar(S.sel);
}

function irPara(aba, mudarHash) {
  S.aba = abaValida(aba); S.voltar = null; S.cancelar = null; S.apagarToken = null;
  if (mudarHash && location.hash.slice(1) !== S.aba) history.pushState(null, '', '#' + S.aba);
  render(); window.scrollTo(0, 0);
  const h = document.querySelector('main h1'); if (h) h.focus({ preventScroll: true });
  if (S.aba === 'versoes') carregarVersoes();
  if (S.aba === 'assistente' && !S.cfgAssist) carregarAssistente();
}

// ---------------------------------------------------------------- ações
async function enviarPedido() {
  const tit = ($('pedTit').value || '').trim();
  if (tit.length < 3) { avisar('Escreva um título (pelo menos 3 letras).', true); $('pedTit').focus(); return; }
  await ocupado('pedido', async () => {
    const r = await enviar({ tipo: 'pedido', projeto: $('pedProj').value, prioridade: $('pedPrio').value, titulo: tit, texto: $('pedTxt').value }, 'Pedido enviado para a fila');
    if (r.ok) { ['pedTit', 'pedTxt'].forEach(k => delete S.rasc[k]); guardarRasc(); S.filtro = 'abertos'; }
    return r;
  });
  carregar();
}
async function confirmarVoltar() {
  const conf = (($('confVoltar') || {}).value || '').trim().toUpperCase();
  if (conf !== 'VOLTAR') { avisar('Digite VOLTAR para confirmar.', true); if ($('confVoltar')) $('confVoltar').focus(); return; }
  const alvo = S.voltar;
  const r = await ocupado('voltar', () => enviar({ tipo: 'voltar-versao', app: alvo.app, versao: alvo.versao, confirmacao: 'VOLTAR' }, `Pronto: voltou para a versão ${alvo.versao}`));
  if (r && r.ok) { S.voltar = null; carregarVersoes(true); }
}
async function salvarToken(prop) {
  const el = $('tok_' + prop), v = (el.value || '').trim();
  if (!v) { avisar('Cole o token antes de salvar.', true); return; }
  if (el.dataset.prefixo && !new RegExp('^(' + el.dataset.prefixo + ')').test(v)) { avisar('Esse token não começa com github_pat_ ou ghp_. Confira se copiou o token do GitHub.', true); return; }
  const r = await ocupado('token', () => enviar({ tipo: 'definir-pc', prop, valor: v }, 'Token salvo'));
  if (r && r.ok) { S.pub = null; carregar(); }
}
document.addEventListener('submit', ev => {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === 'formPedido') return enviarPedido();
  if (f.dataset.formVoltar) return confirmarVoltar();
  const tok = f.querySelector('[data-token]'); if (tok) return salvarToken(tok.dataset.token);
  const b = f.querySelector('[data-acao]'); if (b) b.click();
});
document.addEventListener('input', ev => {
  const t = ev.target; if (!t.id || t.type === 'password') return;
  if (t.id === 'buscaLog') { S.busca = t.value; render(); return; }
  S.rasc[t.id] = t.value;
  if (/^ped/.test(t.id)) guardarRasc();
});
document.addEventListener('change', ev => { const t = ev.target; if (t.id && t.tagName === 'SELECT') { S.rasc[t.id] = t.value; if (/^ped/.test(t.id)) guardarRasc(); } });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.id === 'pedTit') { ev.preventDefault(); $('pedTxt').focus(); }
  if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey) && /^ped/.test(ev.target.id || '')) { ev.preventDefault(); enviarPedido(); }
});
document.addEventListener('click', async ev => {
  const link = ev.target.closest('a[href^="#"]');
  if (link) { ev.preventDefault(); irPara(link.getAttribute('href').slice(1), true); return; }
  const el = ev.target.closest('button'); if (!el || el.type === 'submit') return;
  const d = el.dataset;
  if (d.aba) { irPara(d.aba, true); return; }
  if (d.filtro) { S.filtro = d.filtro; render(); return; }
  if (d.novoPedido) { S.rasc.pedProj = d.novoPedido; guardarRasc(); irPara('pedidos', true); setTimeout(() => $('pedTit') && $('pedTit').focus(), 30); return; }
  if (d.copiar) { try { await navigator.clipboard.writeText(d.copiar); avisar('Relatório copiado.'); } catch (e) { avisar('Não consegui copiar.', true); } return; }
  if (d.cancelar) { S.cancelar = Number(d.cancelar); render(); return; }
  if (d.cancelarNao) { S.cancelar = null; render(); return; }
  if (d.cancelarOk) { const r = await ocupado('cancelar', () => enviar({ tipo: 'pedido-status', id: Number(d.cancelarOk), status: 'cancelado' }, 'Pedido cancelado')); S.cancelar = null; if (r && r.ok) carregar(); return; }
  if (d.voltar) { S.voltar = { app: d.voltar, versao: Number(d.versao) }; render(); setTimeout(() => $('confVoltar') && $('confVoltar').focus(), 30); return; }
  if (d.voltarNao) { S.voltar = null; render(); return; }
  if (d.salvar !== undefined) {
    const i = Number(d.salvar), it = S.cfgAssist.itens[i], valor = $('cfg_' + i).value;
    const r = await ocupado('salvar', () => enviar({ tipo: 'assistente-definir', item: it.item, valor }, 'Salvo no assistente'));
    if (r && r.ok) { it.valor = r.valor !== undefined ? r.valor : valor; delete S.rasc['cfg_' + i]; render(); }
    return;
  }
  if (d.tokenPedir) { S.apagarToken = d.tokenPedir; render(); return; }
  if (d.tokenNao) { S.apagarToken = null; render(); return; }
  if (d.tokenApagar) { const r = await ocupado('token', () => enviar({ tipo: 'definir-pc', prop: d.tokenApagar, valor: '' }, 'Token apagado')); S.apagarToken = null; if (r && r.ok) { S.pub = null; carregar(); } return; }
  if (d.backup) { const r = await ocupado('backup', () => enviar({ tipo: 'definir-pc', prop: 'BACKUP_PLANILHA', valor: d.backup }, d.backup === 'sim' ? 'Cópia diária ligada' : 'Cópia diária desligada')); if (r && r.ok) carregar(); return; }
  switch (d.acao) {
    case 'conferir': carregar(true); break;
    case 'fechar-sel': S.sel = ''; render(); break;
    case 'tentar': carregar(); break;
    case 'recarregar-versoes': carregarVersoes(true); break;
    case 'vistos': { const ate = S.P.estado.avisos[0] ? S.P.estado.avisos[0].id : 0; const r = await ocupado('vistos', () => enviar({ tipo: 'vistos', ate }, 'Avisos marcados como vistos')); if (r && r.ok) carregar(); break; }
    case 'lerbanco': await ocupado('lerbanco', () => enviar({ tipo: 'lerbanco' })); break;
    case 'teste': await ocupado('teste', () => enviar({ tipo: 'teste' }, 'Notificação de teste enviada')); break;
    case 'rotina': { const r = await ocupado('rotina', () => enviar({ tipo: 'assistente-rotina' }, 'Resumo atualizado')); S.saidaRotina = (r && r.texto) || ''; render(); break; }
    case 'diario': await ocupado('diario', () => enviar({ tipo: 'diario-agora' }, 'Rotina da madrugada concluída')); carregar(); break;
    case 'pausar': { const v = ($('pausaAte') || {}).value; if (!v) { avisar('Escolha a data.', true); return; } const r = await ocupado('pausar', () => enviar({ tipo: 'pausar', ate: v })); if (r && r.ok) carregar(); break; }
    case 'retomar': { const r = await ocupado('pausar', () => enviar({ tipo: 'pausar', ate: '' })); if (r && r.ok) carregar(); break; }
    case 'sair': try { localStorage.removeItem(LS); localStorage.removeItem(LR); } catch (e) {} CFG = null; S.P = null; render(); break;
    case 'colar': {
      const c = cfgDeTexto(($('cola') || {}).value || '');
      if (!c) { avisar('Esse não parece o link da central do PC.', true); return; }
      CFG = c; try { localStorage.setItem(LS, JSON.stringify(c)); } catch (e) {} S.erro = ''; carregar(); break;
    }
  }
});
window.addEventListener('popstate', () => irPara(location.hash.slice(1)));
const digitando = () => /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '') || S.voltar || S.cancelar || S.apagarToken || S.ocupado;
setInterval(() => { if (document.visibilityState === 'visible' && !digitando()) carregar(); }, 5 * 60e3);
render();
carregar();
</script>
