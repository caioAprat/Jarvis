<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080706">
<title>Jarvão · Núcleo de controle</title>
<meta name="description" content="Jarvão: o núcleo que vigia os projetos do Caio e avisa quando algo quebra ou volta.">
<link rel="icon" href="icons/jarvis.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600;700&family=Michroma&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  /* mesmos tokens do pc.html / index.html (DESIGN.md §1) */
  :root {
    --bg: #080706; --card: #120e0b; --card2: #1b1510; --linha: rgba(255,170,100,.1);
    --tx: #f6eadb; --mu: #b09c86; --di: #9a8670;
    --ok: #7bf0b4; --ok2: rgba(123,240,180,.13); --er: #ff4d5e; --er2: rgba(255,77,94,.14); --av: #ffc247; --av2: rgba(255,194,71,.13);
    --pri: #ff9a4d; --pri2: rgba(255,138,61,.16);
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace; --disp: "Saira", "Segoe UI", sans-serif;
    --curva: cubic-bezier(.2,0,0,1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  html { overflow-x: clip; }
  body { color: var(--tx); font: 15px/1.5 var(--disp); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overflow-x: clip; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: radial-gradient(ellipse 80% 60% at 60% 0%, rgba(255,120,40,.09), transparent 70%), radial-gradient(ellipse 50% 40% at 0% 100%, rgba(255,90,30,.06), transparent 70%); pointer-events: none; }
  a { color: var(--pri); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; border-radius: 6px; }
  h1, h2 { text-wrap: balance; } p { text-wrap: pretty; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* cena: sem a legenda de baixo; rótulos no padrão da main com contorno --linha e vidro leve */
  .mv-fundo { background: transparent; }
  .mv-cinema .mv-nucleo { display: none; }
  .mv-cinema[data-sem-dados] .mv-st { display: none; }
  .mv-cinema .mv-rotulo { background: rgba(12,9,7,.62); box-shadow: 0 0 0 1px var(--linha), 0 6px 18px rgba(0,0,0,.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: box-shadow .6s var(--curva), background-color .2s var(--curva), scale .12s var(--curva); }
  .mv-cinema .mv-rotulo:hover, .mv-cinema .mv-rotulo.sel { background: rgba(30,18,10,.88); box-shadow: 0 0 0 1px rgba(255,170,100,.3), 0 0 22px rgba(255,120,40,.28), 0 6px 18px rgba(0,0,0,.5); }
  .mv-cinema .mv-rotulo.chegou { box-shadow: 0 0 0 1px rgba(255,170,100,.3), 0 0 18px rgba(255,120,40,.28), 0 6px 18px rgba(0,0,0,.45); transition-duration: .12s; }

  /* ---------------------------------------------------------------- Seção 1: o Núcleo (roteiro) */
  .nucleo { position: relative; z-index: 1; height: 100vh; height: 100svh; pointer-events: none; }
  .pin-spacer { pointer-events: none; }
  .camada { position: absolute; pointer-events: none; will-change: transform, opacity; }
  .entra { opacity: 0; visibility: hidden; }

  .c-logo { left: 32px; top: 26px; }
  .marca { display: flex; align-items: center; gap: 18px; font-size: 29px; }
  .marca .mk { font-size: 66px; filter: drop-shadow(0 0 14px rgba(255,120,40,.5)); }
  .marca-txt { display: flex; flex-direction: column; gap: 10px; }
  .marca-txt h1 { font: inherit; margin: 0; }
  .marca-sub { font: 500 11.5px var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--di); }

  .c-metricas { left: 0; right: 0; bottom: 0; }
  .veu { padding: 150px 32px 40px; background: linear-gradient(to bottom, rgba(8,7,6,0), rgba(8,7,6,.88) 170px); }
  .hud { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 1280px; margin: 0 auto; }
  .hud > div { padding: 4px 22px; border-left: 1px solid var(--linha); min-width: 0; } .hud > div:first-child { border-left: 0; padding-left: 0; }
  .hud small { display: block; font: 500 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: #ecd5b4; }
  .hud b { display: block; margin-top: 6px; font: 700 clamp(26px, 3vw, 40px)/1.1 var(--disp); letter-spacing: -.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud b.ok { color: var(--ok); } .hud b.atencao { color: var(--av); } .hud b.erro { color: var(--er); } .hud b.vazio { color: var(--di); }

  .c-frase { left: 0; right: 0; top: 64%; padding: 0 32px; text-align: center; }
  .c-frase p { max-width: 22em; margin: 0 auto; font: 600 clamp(22px, 2.6vw, 34px)/1.2 var(--disp); letter-spacing: -.3px; text-shadow: 0 0 8px #000, 0 2px 3px #000, 0 0 30px rgba(8,7,6,.88); }

  /* adornos: colchetes de canto e leitura da câmera (≤ .35) */
  .cantos { inset: 18px; opacity: 0; }
  .cantos i { position: absolute; width: 22px; height: 22px; border: 0 solid rgba(255,170,100,.35); }
  .cantos i:nth-child(1) { left: 0; top: 0; border-width: 1px 0 0 1px; } .cantos i:nth-child(2) { right: 0; top: 0; border-width: 1px 1px 0 0; }
  .cantos i:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 1px 1px; } .cantos i:nth-child(4) { right: 0; bottom: 0; border-width: 0 1px 1px 0; }
  .c-leitura { left: 46px; bottom: 40px; font: 500 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #ecd5b4; }
  .regua-n { position: fixed; left: 0; top: 0; z-index: 2; opacity: 0; pointer-events: none; font: 500 10px var(--mono); letter-spacing: .1em; color: #ecd5b4; }

  .dica { left: 50%; bottom: 26px; transform: translateX(-50%); }
  .dica-in { display: inline-flex; align-items: center; gap: 10px; font: 500 10.5px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--di); }
  .dica i { width: 1px; height: 26px; background: linear-gradient(var(--pri), transparent); animation: desce 1.8s var(--curva) infinite; }
  @keyframes desce { from { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } to { transform: scaleY(0); transform-origin: bottom; } }

  /* painel lateral: o mesmo da Central (pc.html .painel-sel) */
  .painel-sel { position: fixed; z-index: 25; top: 92px; right: 24px; max-height: calc(100vh - 220px); width: min(360px, calc(100% - 28px)); overflow: auto; border-radius: 12px;
    background: rgba(12,9,7,.9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 0 0 1px rgba(255,160,80,.4), 0 16px 40px rgba(0,0,0,.6); padding: 18px 18px 16px; animation: entra .28s var(--curva); }
  .painel-sel[hidden] { display: none; }
  @keyframes entra { from { opacity: 0; transform: translateX(14px); } }
  .painel-sel .cab { display: flex; align-items: center; gap: 10px; padding-right: 38px; font: 600 16px var(--disp); }
  .painel-sel .cab .pi { font-size: 18px; color: #ffc58a; }
  .painel-sel .fechar { position: absolute; right: 8px; top: 8px; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 10px; color: var(--mu); box-shadow: inset 0 0 0 1px var(--linha); transition: scale .12s var(--curva); }
  .painel-sel .fechar:active { scale: .96; }
  .painel-sel .fechar svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  .pill { display: inline-flex; align-items: center; margin-top: 12px; padding: 2px 10px; border-radius: 999px; font: 700 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; background: var(--card2); color: var(--mu); }
  .pill.ok { background: var(--ok2); color: var(--ok); } .pill.atencao { background: var(--av2); color: var(--av); } .pill.erro { background: var(--er2); color: var(--er); }
  .painel-sel .det { margin-top: 10px; color: var(--tx); font-size: 14px; }
  .painel-sel .peq { margin-top: 8px; color: var(--mu); font-size: 13px; }
  .painel-sel .ir { display: inline-flex; margin-top: 14px; min-height: 36px; align-items: center; padding: 6px 14px; border-radius: 10px; background: var(--pri2); color: var(--pri); font: 600 13.5px var(--disp); text-decoration: none; }

  .fim { position: relative; z-index: 1; padding: 64px 32px 80px; text-align: center; background: rgba(8,7,6,.88); border-top: 1px solid var(--linha); }
  .fim .btn { display: inline-flex; align-items: center; gap: 9px; min-height: 40px; padding: 8px 16px; border-radius: 10px; background: var(--pri2); color: var(--pri); font: 600 14px var(--disp); text-decoration: none; transition: scale .12s var(--curva); }
  .fim .btn:active { scale: .96; }
  .fim small { display: block; margin-top: 14px; font: 500 11.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--di); }

  @media (max-width: 900px) {
    .c-logo { left: 16px; top: 18px; }
    .marca { font-size: 22px; gap: 12px; } .marca .mk { font-size: 46px; } .marca-sub { font-size: 10px; letter-spacing: .24em; }
    .veu { padding: 120px 16px 28px; }
    .hud { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 14px; }
    .hud > div { padding: 4px 12px; } .hud > div:nth-child(odd) { border-left: 0; padding-left: 0; }
    .hud b { font-size: 26px; }
    .c-frase { top: 60%; padding: 0 16px; } .c-frase p { font-size: 22px; }
    .cantos { inset: 10px; }
    .c-leitura { left: 26px; bottom: 26px; font-size: 9.5px; }
    .painel-sel { top: auto; max-height: 62%; width: auto; left: 10px; right: 10px; bottom: 10px; }
    .fim { padding: 48px 16px 64px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dica i { animation: none; }
    .painel-sel { animation: none; } .fim .btn, .painel-sel .fechar, .mv-cinema .mv-rotulo { transition: none; }
    .nucleo { height: auto; min-height: 100svh; display: flex; flex-direction: column; justify-content: space-between; }
    .camada { position: relative; inset: auto; left: auto; right: auto; top: auto; bottom: auto; transform: none; }
    .c-logo { padding: 26px 32px 0; } .c-frase { padding: 64vh 16px 24px; }
    .entra { opacity: 1; visibility: visible; }
    .cantos, .c-leitura, .dica { display: none; }
  }
</style>
</head>
<body>
<section class="nucleo" id="nucleo" aria-label="Núcleo do Jarvão">
  <div class="camada c-logo" id="c-logo">
    <div class="marca entra"><span id="logo"></span><div class="marca-txt"><h1 id="nome"></h1><span class="marca-sub">Núcleo de controle</span></div></div>
  </div>
  <span class="camada dica" id="dica" aria-hidden="true"><span class="dica-in entra"><i></i>Role para entrar no núcleo</span></span>
  <div class="camada cantos" id="cantos" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="camada c-leitura entra" id="leitura" aria-hidden="true"></div>
  <div class="camada c-frase entra" id="frase"><p>Confere tudo a cada 10 minutos e avisa no iPhone quando algo quebra ou volta.</p></div>
  <div class="camada c-metricas" id="c-metricas">
    <div class="veu">
      <h2 class="sr">Agora no núcleo</h2>
      <div class="hud" id="hud">
        <div class="entra"><small>Situação</small><b class="vazio" data-m="sit">—</b></div>
        <div class="entra"><small>Projetos no ar</small><b class="vazio" data-m="noar">—</b></div>
        <div class="entra"><small>Pedidos abertos</small><b class="vazio" data-m="ped">—</b></div>
        <div class="entra"><small>Avisos novos</small><b class="vazio" data-m="avisos">—</b></div>
      </div>
    </div>
  </div>
</section>
<aside class="painel-sel" id="painel" hidden aria-live="polite"></aside>
<footer class="fim">
  <a class="btn" href="pc.html">Abrir a Central</a>
  <small>Jarvão · núcleo de controle</small>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" integrity="sha384-Z3REaz79l2IaAZqJsSABtTbhjgOUYyV3p90XNnAPCSHg3EMTz1fouunq9WZRtj3d" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js" integrity="sha384-nhO9toQuMo5osCuA0l+YFpSqscZWxDu251Bnho2gD3kSPv1neEwHg0LyEmrA+mPj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js" integrity="sha384-mY+ii969jnDCI2HjRHftH2NZVkIO5ZGUkcnGCg3oVJ3kVstWQXwerYWBg+nbUG4R" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js" integrity="sha384-GkidzTYmQg24v13sa3xhBBbvOLbVLO1QxfyKLdOWweQqNqS/iWwUst2T1fER2Xrg" crossorigin="anonymous"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js" integrity="sha384-aVQ2QnWkoxhOefDB0YZB64OPVzujvccydpcC7UqMDJUK0ChwA382zOHmrWHGDRRa" crossorigin="anonymous"></script>
<script src="mapa-vivo.js?v=25"></script>
<script src="landing-cena.js?v=1"></script>
<script src="landing-cinema.js?v=2"></script>
</body>
