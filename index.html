<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080706">
<title>Jarvão — central do Caio</title>
<link rel="icon" type="image/svg+xml" href="icons/jarvis.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600;700&family=Michroma&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  /* mesmos tokens de pc.html e app.html — nenhuma cor nova */
  :root {
    --bg: #080706; --card: #120e0b; --card2: #1b1510; --linha: rgba(255,170,100,.1);
    --tx: #f6eadb; --mu: #b09c86; --di: #9a8670;
    --ok: #7bf0b4; --ok2: rgba(123,240,180,.13); --er: #ff4d5e; --er2: rgba(255,77,94,.14);
    --av: #ffc247; --av2: rgba(255,194,71,.13); --pri: #ff9a4d; --pri2: rgba(255,138,61,.16);
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace; --disp: "Saira", "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  html { scrollbar-width: none; }
  body { color: var(--tx); font: 15px/1.5 "Saira", "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  h1, .marca, .numero { font-family: var(--disp); }
  .titulo, .pill, .sub, .peq { font-family: var(--mono); }
  h1 { text-wrap: balance; } p { text-wrap: pretty; }
  :focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; border-radius: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  a { color: var(--pri); }

  .brilho { position: fixed; inset: -20vh 0; z-index: -1; pointer-events: none;
    background: radial-gradient(ellipse 80% 60% at 60% 0%, rgba(255,120,40,.09), transparent 70%), radial-gradient(ellipse 50% 40% at 0% 100%, rgba(255,90,30,.06), transparent 70%); }

  #anatomia { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .mv-fundo .mv-nucleo { display: none; }   /* a marca "JARVÃO" da cena já duplicaria a saudação da cena 0 */

  /* ---------------------------------------------------------------- roteiro (10 cenas, pin de 900vh) */
  .roteiro { position: relative; height: 900vh; z-index: 1; }
  .palco-fix { position: sticky; top: 0; height: 100vh; min-height: 540px; overflow: hidden; pointer-events: none; }
  .palco-fix > * { pointer-events: auto; }

  .cena { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 32px; transition: opacity .2s linear; }
  .cena * { text-shadow: 0 0 8px #000, 0 2px 4px #000; }    /* legibilidade sobre o núcleo claro (mesmo padrão do .hud em pc.html) */
  .cena[data-cena="1"], .cena[data-cena="3"], .cena[data-cena="6"], .cena[data-cena="7"], .cena[data-cena="8"], .cena[data-cena="9"] { justify-content: flex-end; padding-bottom: 14vh; }

  /* saudação (cena 0) */
  #saudacao { font-size: 34px; font-weight: 760; letter-spacing: -.4px; }
  #dataResumo { color: var(--mu); font-size: 14px; margin-top: 4px; }
  #fraseDia { color: var(--di); font: 500 12px var(--mono); letter-spacing: .08em; margin-top: 14px; max-width: 420px; }

  /* métricas (cena 1) */
  .hud { display: flex; flex-wrap: wrap; gap: 0; max-width: 100%; width: max-content; }
  .hud > div { padding: 0 20px 0 0; margin-right: 20px; border-right: 1px solid var(--linha); }
  .hud > div:last-child { border-right: 0; }
  .hud small { display: block; font: 500 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: #ecd5b4; text-shadow: 0 0 6px #000, 0 1px 2px #000; }
  .hud b { display: block; margin-top: 2px; font: 700 24px/1.15 var(--disp); text-shadow: 0 0 8px #000, 0 2px 3px #000; }
  .hud b.ok { color: var(--ok); } .hud b.atencao { color: var(--av); } .hud b.erro { color: var(--er); }

  /* rótulo de construção (cena 2) */
  #rotuloConstrucao { color: var(--di); font: 500 11.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; max-width: 360px; }

  /* projetos (cena 3) */
  .lista-proj { display: flex; flex-wrap: wrap; gap: 8px 10px; max-width: 640px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; background: var(--card2); color: var(--mu); font-size: 11px; font-weight: 700; }
  .pill .pi { width: 13px; height: 13px; }
  .pill[data-st=ok] { color: var(--ok); background: var(--ok2); }
  .pill[data-st=atencao] { color: var(--av); background: var(--av2); }
  .pill[data-st=erro] { color: var(--er); background: var(--er2); }

  /* anatomia (cenas 6-8): rótulo real ligado por linha (ver #anatomia) */
  .rotulo-anatomia { display: inline-flex; flex-direction: column; gap: 2px; max-width: 320px; }
  .rotulo-anatomia .titulo { margin: 0; color: var(--mu); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .14em; }
  .rotulo-anatomia b { font: 700 18px var(--disp); color: var(--tx); }
  .rotulo-anatomia .peq { color: var(--di); font-size: 11px; }
  .sem-dados { color: var(--di); font: 500 12px var(--mono); }

  /* fecho (cena 9) */
  .fecho { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .btn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 9px 16px; border-radius: 10px; background: var(--pri); color: #0b0f17; font-weight: 650; font-size: 13px; transition: transform .12s cubic-bezier(.2,0,0,1); }
  .btn:active { transform: scale(.96); }

  /* três planos: aplicados via JS (opacity/blur/scale), mas o estado inicial já existe aqui para não "piscar" */
  [data-plano-ini] { will-change: opacity, filter, transform; }

  @media (max-width: 700px) {
    .cena { padding: 0 18px; }
    #saudacao { font-size: 26px; }
    .hud b { font-size: 19px; }
    .hud > div { padding-right: 14px; margin-right: 14px; }
    .rotulo-anatomia { max-width: 240px; }
  }

  /* estado estático (prefers-reduced-motion): uma tela só, legível, sem roteiro de scroll */
  .estatico .roteiro { height: auto; }
  .estatico .palco-fix { position: relative; height: auto; min-height: 100vh; display: flex; flex-direction: column; gap: 28px; padding: 60px 32px; }
  .estatico .cena { position: relative; inset: auto; padding: 0; opacity: 1 !important; filter: none !important; transform: none !important; }
  .estatico .cena[data-cena="2"], .estatico .cena[data-cena="4"], .estatico .cena[data-cena="5"], .estatico .cena[data-cena="6"], .estatico .cena[data-cena="7"], .estatico .cena[data-cena="8"] { display: none; }
  .estatico #anatomia { display: none; }
  @media (prefers-reduced-motion: reduce) { .mk-r1, .mk-r2, .mk-t, .mk-core { animation: none !important; } }
</style>
</head>
<body>
<div class="brilho" aria-hidden="true"></div>
<canvas id="anatomia" aria-hidden="true"></canvas>

<main class="roteiro" id="roteiro">
  <div class="palco-fix" id="palco">

    <section class="cena" data-cena="0">
      <h1 id="saudacao">Olá, Caio</h1>
      <p id="dataResumo"></p>
      <p id="fraseDia" data-plano-ini="0:0,1:1"></p>
    </section>

    <section class="cena" data-cena="1">
      <div class="hud" id="hud" data-plano-ini="1:0,2:1"></div>
    </section>

    <section class="cena" data-cena="2">
      <p id="rotuloConstrucao" data-plano-ini="2:1">O núcleo se monta ao fundo.</p>
    </section>

    <section class="cena" data-cena="3">
      <div class="lista-proj" id="lista" data-plano-ini="3:0,4:1"></div>
    </section>

    <section class="cena" data-cena="6">
      <div class="rotulo-anatomia" id="rotAnatCasca">
        <span class="titulo">Casca — status dos projetos</span>
        <b id="valAnatCasca">—</b>
      </div>
    </section>

    <section class="cena" data-cena="7">
      <div class="rotulo-anatomia" id="rotAnatInterior">
        <span class="titulo">Interior — situação financeira</span>
        <b id="valFinanceiro">—</b>
      </div>
    </section>

    <section class="cena" data-cena="8">
      <div class="rotulo-anatomia" id="rotAnatMalha">
        <span class="titulo">Malha de dados — clientes e pedidos</span>
        <b id="valClientes">—</b>
      </div>
    </section>

    <section class="cena" data-cena="9">
      <div class="fecho">
        <p class="peq" style="color:var(--di)">Buscar (Ctrl K), Conferir tudo, dock e painéis: na Central do PC.</p>
        <a class="btn" href="pc.html">Abrir a Central do PC →</a>
      </div>
    </section>

  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" integrity="sha384-Z3REaz79l2IaAZqJsSABtTbhjgOUYyV3p90XNnAPCSHg3EMTz1fouunq9WZRtj3d" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js" integrity="sha384-nhO9toQuMo5osCuA0l+YFpSqscZWxDu251Bnho2gD3kSPv1neEwHg0LyEmrA+mPj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js" integrity="sha384-mY+ii969jnDCI2HjRHftH2NZVkIO5ZGUkcnGCg3oVJ3kVstWQXwerYWBg+nbUG4R" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js" integrity="sha384-GkidzTYmQg24v13sa3xhBBbvOLbVLO1QxfyKLdOWweQqNqS/iWwUst2T1fER2Xrg" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js" integrity="sha384-2EpLreWSFuZsk4hcSplXLhlHd/wzvDNF907bTGIXSXM0SlhJNzy4YK0DhBFvkFEs" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js" integrity="sha384-I3lsvPeDJYFrEAzn/TA0yhc/SCYKwpyfyq8lKzHYKohu43H9f7xc/Q9ZWgSVUDl3" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js" integrity="sha384-pG/SGpuNNuluvSd84K35qyRFdMxn8P8MyqIQuxjUb0wPPRgJ7yDLRQT64nLuT8CR" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js" integrity="sha384-aVQ2QnWkoxhOefDB0YZB64OPVzujvccydpcC7UqMDJUK0ChwA382zOHmrWHGDRRa" crossorigin="anonymous"></script>
<script src="mapa-vivo.js?v=25"></script>
<script src="cadeado.js?v=1"></script>
<script src="landing-dados.js?v=1"></script>
<script src="landing-cinema.js?v=2"></script>
<script src="landing-particulas.js?v=1"></script>
<script src="landing-ponteiro.js?v=1"></script>
<script src="landing-anatomia.js?v=1"></script>
<script src="landing-roteiro.js?v=1"></script>
<script>
'use strict';
const reduzido = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
if (reduzido) document.body.classList.add('estatico');

const mapa = window.MapaVivo ? MapaVivo.montar({ fundo: true, leve: innerWidth < 700 }) : null;
if (mapa) document.body.appendChild(mapa.el);

const dados = { temChave: false, pc: null, erroPc: 'carregando', fin: null, erroFin: 'carregando' };
const roteiro = window.LandingRoteiro ? LandingRoteiro.montar({ hero: document.getElementById('roteiro'), mapa, reduzido, dados }) : null;

function carregarDadosReais() {
  if (!window.LandingDados) return;
  LandingDados.carregar().then(r => {
    Object.assign(dados, r); if (roteiro) roteiro.atualizarDados(r); else LandingRoteiro.preencherDOM(r);
    if (mapa && r.pc) { const m = LandingDados.metricas(r.pc); mapa.atualizar(r.pc.estado.projetos, { estado: m.situacao[0], titulo: '' }); }
  });
}
// a chave de verdade (link) já pode estar guardada neste aparelho (via pc.html); o PIN só tranca
// a TELA, não troca a chave — ver cadeado.js. Sem chave guardada, não há nada a trancar.
let temCfgGuardada = false; try { temCfgGuardada = !!JSON.parse(localStorage.getItem('jarvis.pc.cfg')); } catch (e) {}
if (temCfgGuardada && window.Cadeado && !Cadeado.destravado()) {
  const tela = document.createElement('div'); tela.id = 'cadeadoLanding'; document.body.appendChild(tela);
  Cadeado.pedir(tela, () => { tela.remove(); carregarDadosReais(); });
} else carregarDadosReais();

window.__landing = { mapa, roteiro, dados };   // só para conferir no console / nos testes de tela
</script>
</body>
</html>
